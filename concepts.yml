# The messaging bounded context: sending email, SMS, chat-app and push messages, and the
# templates, senders, numbers, conversations and suppressions around them. See
# ../schema-commons for the method; the only judgement in this repo is in this file.
#
# Cohort decision: "Email Marketing" (campaigns and lists -- a marketing context), "Email
# Verification", "Email Finder" and "Email Security" (data and security products) and
# "Message Broker" / "Message Queue" (infrastructure, where a message is a queue entry) are
# NOT used.
context: messaging
name: Messaging (Email, SMS, Chat)
tags: [Messaging, Email, SMS, WhatsApp, CPaaS, Omnichannel, Push Notifications, Notification,
       Notifications, Transactional Email, Email API, Email Deliverability, RCS, MMS, Push, SMS Marketing]

envelope: [_links, _pagination, _results, data, success, errors, warnings, count, total, page, meta, links,
           value, results, next, previous, has_more, message, status_code, ids, next_page, previous_page,
           page_info, cursor, total_count, per_page, total_pages, current_page, object, url, uri]

common_fields:
  id: [uuid, guid, object_id, record_id, sid, message_id, msg_id]
  created_at: [created, created_date, created_time, date_created, create_time, creation_date, created_on, timestamp]
  updated_at: [updated, updated_date, modified_at, last_modified, date_modified, update_time, modified_date, date_updated]
  metadata: [meta_data, custom_fields, custom, attributes, properties, custom_args, tags, variables]
  status: [state, delivery_status, message_status]
  name: [title, display_name, label, friendly_name]

concepts:
  message:
    segments: [messages, message, emails, email, mail, sms, texts, mms, notifications, sends]
    aliases:
      to: [recipient, recipients, to_number, destination, destinations, phone_number, msisdn, to_email, address, receiver, personalizations]
      from: [sender, from_number, from_email, originator, source, sender_id, source_address]
      body: [text, content, message, html, html_body, text_body, plain_text, text_content, html_content, message_body]
      subject: [title, headline]
      channel: [type, message_type, channel_type, medium, kind]
      direction: [inbound, outbound]
      sent_at: [date_sent, send_at, sent, sent_time, delivered_at, scheduled_at, send_time]
      template_id: [template, template_name, template_uuid]
      attachments: [files, media, media_url, media_urls, attachment]
      error_code: [error, error_message, failure_reason, reason, errors_code]
      cost: [price, segments_cost, charge, credits]
      segments: [num_segments, parts, message_parts, sms_count]
      conversation_id: [thread_id, chat_id, conversation]
  template:
    requires: [message]
    segments: [templates, template, message_templates, email_templates, content_templates, message-templates]
    aliases:
      body: [content, html, html_content, text, components, text_body, html_body, plain_content]
      subject: [title]
      language: [locale, lang]
      category: [type, template_type, kind]
      variables: [placeholders, parameters, merge_fields, fields]
  conversation:
    requires: [message]
    segments: [conversations, conversation, threads, chats]
    aliases:
      participants: [members, recipients, contacts, users]
      last_message_at: [last_activity_at, last_message_time, updated_at]
      channel: [type, channel_type, source]
  phone_number:
    requires: [message]
    path: /phone-numbers
    segments: [phone_numbers, phone-numbers, phonenumbers, numbers, incoming_phone_numbers, incomingphonenumbers, virtual_numbers, long_codes, short_codes]
    aliases:
      number: [phone_number, msisdn, e164, value, phone]
      country: [country_code, iso_country, region]
      capabilities: [features, type, number_type]
  sender:
    requires: [message]
    segments: [senders, sender, sender_ids, sender-ids, senderids, verified_senders, sender_identities, from_addresses, identities]
    aliases:
      email: [from_email, address, email_address, from]
      verified: [is_verified, verification_status, verified_at, status]
      domain: [domain_name]
  suppression:
    requires: [message]
    segments: [suppressions, suppression, bounces, unsubscribes, blocks, spam_reports, blocklist, block_list, opt_outs, optouts, opt-outs, suppression_list, complaints]
    aliases:
      address: [email, email_address, recipient, phone_number, number, value]
      reason: [type, suppression_type, cause, status]

exclude:
  message:
    nodeping: /notifications are uptime-monitor alert settings
    outrival: /messages are AI-assistant chat turns (role + content), not a sent message

# One company, several catalog listings (scripts/duplicates.py, confirmed by hand).
duplicates:
  quo: [openphone]
  khoros-ai: [lithium]
